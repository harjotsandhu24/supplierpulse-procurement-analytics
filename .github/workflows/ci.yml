name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Run pipeline (no rendering)
        run: python -m supplierpulse.pipeline
      - name: Fast tests
        run: pytest -m "not slow" -q
      - name: Excel recalculation test
        run: pytest -m slow -q
