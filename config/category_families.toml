# Analyst-defined grouping of NIGP 3-digit commodity classes (first three digits of the
# City of Austin COMMODITY code) into readable spend families.
#
# This is a documented judgement, not an official taxonomy. Class labels shown in the
# outputs come from the dataset's own commodity descriptions; any class not listed
# below falls into "Other goods". Edit and re-run the pipeline to regroup.
#
# Known compromise: class 269 (drugs and pharmaceuticals) is grouped with water treatment
# because its focus-window spend is dominated by magnesium hydroxide, a treatment chemical.

[families]
"Fleet vehicles, parts & tires" = ["055", "060", "065", "070", "071", "072", "073", "556", "557", "558", "559", "863"]
"Heavy equipment & tools" = ["020", "022", "025", "035", "120", "445", "515", "545", "560", "755", "760", "765", "895"]
