"IT hardware & software" = ["203", "204", "205", "206", "207", "208", "209", "880", "883"]
"Radio, telecom & video" = ["655", "725", "726", "730", "803", "838", "839", "840"]
"Fuel & lubricants" = ["370", "405"]
"Water & wastewater treatment" = ["180", "190", "210", "245", "269", "271", "315", "658", "659", "670", "720", "885", "890"]
"Road & construction materials" = ["135", "150", "155", "330", "400", "540", "570", "630", "745", "750", "770", "790"]
"Public safety, medical & lab" = ["175", "193", "257", "260", "270", "340", "345", "415", "435", "465", "470", "475", "490", "493", "495", "680", "875", "898"]
